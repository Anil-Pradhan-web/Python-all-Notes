<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10 - Student Info Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 150px 220px;
            width: 370px;
            border: 1px solid black;
        }

        .container div {
            border: 1px solid black;
            padding: 10px;
        }

        .label {
            font-weight: bold;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">Name</div>
        <div>Israr</div>

        <div class="label">Address</div>
        <div>Bhadrak</div>

        <div class="label">Course</div>
        <div>B.Tech CSE</div>

        <div class="label">Email</div>
        <div>israr@email.com</div>

        <div class="label">Phone</div>
        <div>9999999999</div>
    </div>
</body>
</html>
